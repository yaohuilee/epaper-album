<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备配网</title><link rel="stylesheet" href="/ui.css"><style>
body{margin:0;background:#f5f7fa}.setup{max-width:760px;margin:24px auto;padding:24px;background:white;border:1px solid #e8edf3;border-radius:12px;display:flex;flex-direction:column;gap:16px;height:calc(100dvh - 48px);max-height:780px;box-sizing:border-box}.setup h1{font-size:24px;margin:0}.setup p{margin:0}.setup header,.setup .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.setup form{display:flex;flex-direction:column;gap:16px;min-height:0;flex:1}.setup .wifi-discovery{flex:1;min-height:80px;display:flex;flex-direction:column;gap:8px}.setup .wifi-networks{flex:1;min-height:0;overflow:auto;grid-auto-rows:max-content}.setup .wifi-fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.setup .actions{margin:0;padding-top:12px;border-top:1px solid #e8edf3;justify-content:flex-end}.setup .note{font-size:13px}.result{padding:12px;background:#e6f4ff;border-radius:6px;overflow-wrap:anywhere}.result.error{background:#fff1f0;color:#cf1322}.setup label{display:block;margin-bottom:6px}.setup .wifi-open-label{display:flex;align-items:center;margin:8px 0 0;gap:8px}.setup .wifi-open-label input{width:auto}.setup button{flex-shrink:0}@media(max-width:599px){.setup{margin:0;height:100dvh;max-height:none;padding:16px;border:0;border-radius:0;gap:12px}.setup form{gap:12px}.setup .wifi-fields{grid-template-columns:1fr;gap:10px}.setup .wifi-networks{grid-template-columns:1fr}.setup h1{font-size:21px}}@media(max-height:520px) and (min-width:600px){.setup form{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto}.setup .wifi-fields{grid-template-columns:1fr;align-content:start;gap:8px;overflow:auto}.setup .actions{grid-column:1/-1}.setup{margin:8px auto;height:calc(100dvh - 16px);padding:16px;gap:8px}}

.setup.complete{height:auto;min-height:320px;max-height:none;padding:48px 24px;gap:0;text-align:center}.setup.complete>header,.setup.complete>#ap,.setup.complete>#result,.setup.complete>#settings{display:none}.success{display:none}.setup.complete .success{display:flex;flex-direction:column;align-items:center;gap:16px}.success-icon{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:#f0fff4;color:#389e0d}.success-icon svg{width:32px;height:32px}.success h1{font-size:28px}.success-address{padding:16px 12px;border:1px solid #e8edf3;border-radius:8px;background:#fafcff;max-width:100%;box-sizing:border-box}.success-address span{display:block;font-size:14px;color:#718096;margin-bottom:8px}.success-address a{display:inline-block;max-width:100%;font:clamp(14px,4vw,18px) Consolas,monospace;white-space:nowrap;overflow-wrap:normal}.success .note{color:#718096}.setup.complete .success{min-width:0}@media(max-width:599px){.setup.complete{min-height:100dvh;justify-content:center;padding:32px 16px}.setup.complete .success{padding:24px 12px;max-width:100%;box-sizing:border-box}}
</style></head><body><main class="setup"><header><h1>设备配网</h1><span id="badge" class="note">正在读取…</span></header><p id="ap" class="note">设备热点 · http://192.168.7.60/setup</p><div id="result" class="result" role="status">选择 2.4 GHz 网络，或输入隐藏网络名称。</div><form id="settings"><section class="wifi-discovery"><div class="toolbar"><strong>可用 Wi-Fi</strong><button id="scan" type="button" class="secondary" disabled>重新扫描</button></div><p id="scan-state" class="note">尚未扫描。</p><div id="networks" class="wifi-networks"></div></section><div class="wifi-fields"><div><label for="ssid">Wi-Fi 名称（SSID）</label><input id="ssid" maxlength="32" autocomplete="off" required disabled></div><div><label for="password">密码</label><input id="password" type="password" maxlength="64" autocomplete="new-password" disabled><label class="wifi-open-label"><input id="open" type="checkbox" disabled>无密码网络</label></div></div><footer class="actions"><button id="undo" class="secondary" type="button" disabled>撤销</button><button id="save" type="submit" disabled>保存并连接</button></footer></form><section id="success" class="success" aria-live="polite"><div class="success-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="m7 16 6 6 12-13" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>配置成功</h1><div class="success-address"><span>设备 Web 服务地址</span><a id="device-address"></a></div><p class="note">配置已保存，无需重复操作。</p><p id="ap-countdown" class="note" hidden></p><p class="note">手机连接同一 Wi-Fi 后可访问。</p></section></main><script src="/i18n.js"></script>
<script>var __t=typeof window!=='undefined'&&window.epaperI18n?window.epaperI18n.t:(s=>s);

'use strict';const $=id=>document.getElementById(id);let status=null,sending=false,scanning=false,job=null,loaded=false,scanStarted=false,complete=false,pollTimer=null;
function startApCountdown(seconds){
 const el=$('ap-countdown');el.hidden=false;
 const end=performance.now()+Math.max(0,Number(seconds)||0)*1000;
 let timer=null;
 const tick=()=>{const left=Math.max(0,Math.ceil((end-performance.now())/1000));el.textContent=left?__t('配网热点将在 ')+left+__t(' 秒后关闭。'):__t('配网热点保留时间已结束。');if(!left&&timer!==null)clearInterval(timer)};
 tick();if(seconds>0)timer=setInterval(tick,1000);
}
function showSuccess(ip,remaining){
 if(!ip||complete)return;complete=true;job=null;clearInterval(pollTimer);
 const url='http://'+ip+'/';$('device-address').href=url;$('device-address').textContent=url;
 $('settings').hidden=true;document.querySelector('.setup').classList.add('complete');
 $('password').value='';$('networks').replaceChildren();
 if(status?.network.provisioning)startApCountdown(remaining);
}
function mode(){return $('open').checked?'open':$('password').value||$('ssid').value!==status.network.configured_ssid||!status.network.wifi_password_set?'replace':'keep'}
function valid(){const n=new TextEncoder().encode($('ssid').value).length,p=$('password').value,k=new TextEncoder().encode(p).length;return n>0&&n<=32&&(mode()!=='replace'||k>=8&&k<=63||k===64&&/^[a-f0-9]{64}$/i.test(p))}
function controls(){document.body.dataset.operation=sending||scanning||job?'busy':'';const locked=!status||sending||scanning||job||status.control.busy;for(const el of $('settings').querySelectorAll('input,button'))el.disabled=!!locked;$('password').disabled=!!locked||$('open').checked;$('password').placeholder=!status?'':mode()==='open'?__t('此网络无需密码'):mode()==='keep'?__t('密码已保存，留空保留'):__t('输入网络密码');$('save').disabled=!!locked||!valid();$('save').textContent=sending||job?__t('正在连接…'):__t('保存并连接')}
function load(){if(!status)return;$('ssid').value=status.network.configured_ssid||'';$('password').value='';$('open').checked=!!$('ssid').value&&!status.network.wifi_password_set;loaded=true;controls()}
function message(text,error=false){$('result').textContent=text;$('result').classList.toggle('error',error)}
async function api(url,data){const r=await fetch(url,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json','X-Album-Token':status.control.token}:{'X-Album-Token':status?.control.token||''},body:data?JSON.stringify(data):undefined,cache:'no-store'});if(!r.ok)throw Error(__t('请求失败（HTTP ')+r.status+__t('）。'));return r.json()}
function networks(list){$('networks').replaceChildren();const seen=new Set();for(const n of list){if(!n.ssid||seen.has(n.ssid))continue;seen.add(n.ssid);const b=document.createElement('button');b.type='button';b.className='wifi-network secondary';const name=document.createElement('strong'),detail=document.createElement('span');name.textContent=n.ssid;detail.textContent=n.rssi_dbm+' dBm · '+(n.open?__t('无密码'):__t('加密'));b.append(name,detail);b.onclick=()=>{$('ssid').value=n.ssid;$('password').value='';$('open').checked=n.ssid===status.network.configured_ssid?!status.network.wifi_password_set:n.open;controls();if(mode()==='replace')$('password').focus({preventScroll:true})};$('networks').append(b)}return seen.size}
async function scan(){if(complete||!status||sending||job||scanning||status.control.busy)return;scanning=true;controls();$('scan-state').textContent=__t('正在扫描…');try{const task=await api('/api/wifi-scan',{});const deadline=performance.now()+30000;while(performance.now()<deadline){await new Promise(r=>setTimeout(r,700));const s=await api('/api/wifi-scan');if(s.job_id!==task.job_id)continue;if(s.state==='succeeded'){$('scan-state').textContent=__t('发现 ')+networks(s.networks)+__t(' 个网络');return}if(s.state==='failed')throw Error(__t('扫描失败。'))}throw Error(__t('扫描超时。'))}catch(e){$('scan-state').textContent=e.message}finally{scanning=false;await refresh();controls()}}
async function refresh(){if(complete)return;try{status=await api('/api/status');if(complete)return;$('badge').textContent=status.network.provisioning?__t('配网模式'):__t('设备已联网');$('ap').textContent=status.network.provisioning?__t('热点：')+status.network.ap_ssid+__t(' · 无密码'):__t('设备地址：http://')+status.network.ip+'/';if(!loaded)load();if(!job&&status.network.provisioning&&status.network.wifi_connected&&status.network.ap_shutdown_remaining_seconds>0){showSuccess(status.network.ip,status.network.ap_shutdown_remaining_seconds);return}if(job&&status.control.job_id===job&&['succeeded','failed'].includes(status.control.state)){if(status.control.state==='succeeded'){showSuccess(status.network.ip,status.network.ap_shutdown_remaining_seconds);return}else {message(status.control.error.includes('original SD Wi-Fi restored')?__t('连接失败，原配置已恢复。热点仍开放。'):status.control.error.includes('Connection failed')?__t('连接失败，热点仍开放。'):__t('配置保存失败，请检查 SD 卡配置。'),true);load()}job=null}controls();if(!scanStarted&&!status.control.busy){scanStarted=true;scan()}}catch(e){if(complete)return;$('badge').textContent=__t('连接中断');if(!job)message(__t('请连接设备热点后刷新此页面。'),true)}}
$('scan').onclick=scan;$('undo').onclick=load;$('settings').oninput=controls;$('open').onchange=()=>{$('password').value='';controls()};$('settings').onsubmit=async e=>{e.preventDefault();if(!status||sending||job||!valid())return;const data={schema_version:1,ssid:$('ssid').value};if(mode()!=='keep')data.password=mode()==='open'?'':$('password').value;sending=true;controls();message(__t('正在保存并连接…'));try{job=(await api('/api/wifi-settings',data)).job_id;$('password').value=''}catch(e){message(e.message,true)}finally{sending=false;controls()}};pollTimer=setInterval(refresh,2000);refresh();
</script></body></html>
