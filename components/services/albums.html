<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨水相册 · 照片管理</title>
<link rel="stylesheet" href="/ui.css">
<body data-page="albums"><header class="app-header"><div class="brand"><button id="menu-toggle" class="menu-toggle" aria-label="打开操作菜单" aria-controls="sidebar" aria-expanded="false">☰</button><span class="brand-mark" aria-hidden="true">▤</span>墨水相册</div><div class="header-right"><span class="header-note">ESP32-S3 · 相册控制台</span><time id="device-clock" data-device-clock class="device-clock" aria-label="设备当前时间（设备时间）" title="设备 RTC · 设备时间">—</time><span class="badge" id="badge">正在连接</span></div></header>
<div class="app-layout"><button id="menu-backdrop" class="menu-backdrop" aria-label="关闭操作菜单" tabindex="-1"></button><aside id="sidebar" class="sidebar"><div class="nav-caption">工作区导航</div><nav aria-label="操作入口"><details open><summary>设备管理</summary><a href="/#overview">设备概览</a><a href="/#network">网络与时间</a><a href="/#environment">环境与供电</a><a href="/#sound">声音与报时</a></details><details open><summary>相册管理</summary><a href="/albums#photos">照片库</a><a href="/#playback">播放设置</a></details></nav><div class="side-footer"><button id="sidebar-next" aria-live="polite" disabled>切换下一张</button><div class="side-details"><p class="side-meta"><span>当前相册</span><span id="sidebar-album">—</span></p><p class="side-meta"><span>当前照片</span><button id="sidebar-photo" class="sidebar-photo-link" type="button" aria-label="预览当前照片" disabled>—</button></p><p class="side-meta"><span>下次换图</span><span data-countdown="photo">—</span></p></div></div></aside>
<main class="workspace"><div class="breadcrumbs"><span id="crumb-group"></span> / <span id="crumb-view"></span></div><div class="workspace-heading"><div><h1 id="view-title">照片库</h1><p id="view-description">正在读取相册信息</p></div><button id="reload" class="secondary workspace-refresh" disabled>刷新</button></div><p id="nav-feedback" role="status" aria-live="polite"></p>
<section class="explorer" aria-label="相册文件浏览器">
<div class="explorer-toolbar"><button id="up" class="secondary" disabled aria-label="返回所有相册">↑ 返回</button><div class="explorer-address"><button id="root" class="address-root" disabled>相册</button><span id="folder-path"></span></div><button id="add-photos" disabled aria-expanded="false" aria-controls="upload-panel">上传照片</button></div>
<div class="explorer-info"><p id="album-note">正在读取设备与相册信息…</p><input id="filter" type="search" placeholder="筛选相册名称" aria-label="筛选当前列表"></div>
<div id="upload-panel" class="upload-panel" hidden><div class="toolbar"><h2>上传到当前相册</h2><button id="close-upload" class="secondary">收起上传</button></div><div id="drop" class="drop"><label for="file">选择多张 BMP，或将文件拖到这里</label><br><input id="file" type="file" accept=".bmp,image/bmp" multiple disabled><p class="note">照片格式：六色、24位无压缩 BMP。单张上限：2 MiB。同名文件不覆盖。切换相册清空待上传选择。</p><div class="upload-actions"><button id="upload" disabled>上传所选照片</button><button id="clear-files" class="secondary" disabled>清空选择</button></div><p id="selected" class="note">尚未选择文件</p></div><progress id="progress" max="100" value="0" hidden aria-label="文件传输进度"></progress></div>
<h2 id="count" class="explorer-count">相册文件夹</h2><div id="photos" class="photo-grid"></div><div id="pagination" class="pager" hidden><button id="previous" class="secondary" disabled>上一页</button><span id="page">—</span><button id="following" class="secondary" disabled>下一页</button></div>
</section><footer>相册文件保存在 SD 卡。深睡期间页面离线。</footer>
</main></div><div class="operation-toast" id="feedback" role="status" aria-live="polite" hidden><span id="feedback-text"></span><button id="dismiss-feedback" class="secondary" aria-label="关闭操作提示">×</button></div><dialog id="preview" class="app-dialog" closedby="none" aria-labelledby="preview-title"><div class="dialog-header"><h2 id="preview-title">照片预览</h2><button id="dismiss-preview" type="button" class="modal-close" aria-label="关闭照片预览">×</button></div><div class="preview-caption"><strong id="preview-name"></strong><span id="preview-position"></span></div><div class="preview-stage"><p id="preview-status" class="note" role="status" hidden></p><img hidden id="preview-image" width="800" height="480" alt="照片预览"><button id="preview-previous" class="preview-arrow previous" type="button" aria-label="预览上一张" disabled>‹</button><button id="preview-next" class="preview-arrow next" type="button" aria-label="预览下一张" disabled>›</button></div><p class="note">预览来源：原始 BMP 文件。</p></dialog>
<dialog id="delete-dialog" class="app-dialog" closedby="none" aria-labelledby="delete-title"><div class="dialog-header"><h2 id="delete-title">删除这张照片？</h2><button id="close-delete" type="button" class="modal-close" aria-label="关闭删除确认">×</button></div><p id="delete-name"></p><p>照片将从 SD 卡永久删除，无法撤销。</p><div class="actions dialog-footer"><button id="cancel-delete" class="secondary" autofocus>取消</button><button id="confirm-delete" class="danger">确认删除</button></div></dialog>
<script src="/ui.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),limit=50,sleep=ms=>new Promise(r=>setTimeout(r,ms));
let token='',online=false,working=false,deviceBusy=false,albums=[],currentAlbum='',listing=null,offset=0,chosen=[],polling=false;
const size=n=>n>=1048576?(n/1048576).toFixed(2)+' MiB':(n/1024).toFixed(1)+' KiB';
let messageTimer;function message(text,error=false){clearTimeout(messageTimer);$('feedback-text').textContent=text;$('feedback').classList.toggle('error',error);$('feedback').hidden=!text;if(text&&!error)messageTimer=setTimeout(()=>{if(!working)$('feedback').hidden=true},5000)}
$('dismiss-feedback').onclick=()=>{clearTimeout(messageTimer);$('feedback').hidden=true};
function enable(){const blocked=!online||working||deviceBusy,inside=!!currentAlbum;$('reload').disabled=blocked;for(const id of ['file','add-photos'])$(id).disabled=blocked||!inside;$('clear-files').disabled=working||!chosen.length;$('upload').disabled=blocked||!inside||!chosen.length;for(const id of ['up','root'])$(id).disabled=blocked||!inside;$('previous').disabled=blocked||!offset;$('following').disabled=blocked||listing?.next_offset==null;for(const b of $('photos').querySelectorAll('button'))b.disabled=blocked}
function showUpload(open){$('upload-panel').hidden=!open;$('add-photos').setAttribute('aria-expanded',String(open))}
function folderRoute(){try{return location.hash.startsWith('#photos/')?decodeURIComponent(location.hash.slice(8)):''}catch{return '__invalid__'}}
function goFolder(id){location.hash=id?'photos/'+encodeURIComponent(id):'photos'}
async function syncFolder(){let id;try{id=folderRoute()}catch{message('相册地址无效。',true);return}if(working)return;if(id===currentAlbum)return;await operation(async()=>{if(id&&!albums.some(a=>a.id===id)){message('找不到该相册，请返回相册目录。',true);id=''}currentAlbum=id;offset=0;listing=null;$('filter').value='';$('file').value='';selectFiles([]);closePreview();showUpload(false);message('');if(currentAlbum)$('album-note').textContent='正在读取相册照片…';draw();if(currentAlbum)await loadList()})}
function closePreview(){window.photoPreview.close()}
function confirmDelete(name){return new Promise(resolve=>{const dialog=$('delete-dialog');$('delete-name').textContent=name;let accepted=false;$('cancel-delete').onclick=$('close-delete').onclick=()=>dialog.close();$('confirm-delete').onclick=()=>{accepted=true;dialog.close()};dialog.onclose=()=>resolve(accepted);dialog.showModal();$('cancel-delete').focus()})}
function markOffline(){online=false;window.sidebarOffline?.();$('badge').classList.add('offline');$('badge').textContent='设备离线';enable()}
async function status(){const r=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error('状态读取失败（HTTP '+r.status+'）');const s=await r.json();s.rtc.age_ms=Math.max(0,Number(r.headers.get('X-Status-Age-Ms'))||0);if(token&&token!==s.control.token){listing=null;closePreview();draw();message('设备已重启，请刷新相册列表。')}token=s.control.token;online=true;$('badge').classList.remove('offline');deviceBusy=s.control.busy;window.renderSidebar?.(s);$('badge').textContent=deviceBusy?'设备忙碌':'设备在线';enable();return s}
async function request(path,options={},retry=false){const deadline=Date.now()+45000;while(true){let r;try{r=await fetch(path,{...options,headers:{'X-Album-Token':token,...options.headers},cache:'no-store',signal:AbortSignal.timeout(65000)})}catch(e){markOffline();throw Error('网络响应未确认，请恢复连接并刷新列表，确认文件状态后再操作。')}
if(r.ok)return r;let info;try{info=await r.json()}catch{info={message:'HTTP '+r.status}}if(retry&&r.status===409&&info.error==='busy'&&Date.now()<deadline){await sleep(750);continue}if(r.status===403){await status();throw Error('设备令牌已更新，请重试操作。')}throw Error(info.error==='busy'?'设备正在刷屏或更新索引，请稍后重试。':info.message||'HTTP '+r.status)}}
function path(name){return '/api/photo?'+new URLSearchParams({album:currentAlbum,name})}
function draw(){const box=$('photos');box.replaceChildren();const filter=$('filter').value.toLocaleLowerCase(),inside=!!currentAlbum,a=albums.find(a=>a.id===currentAlbum);$('folder-path').textContent=inside?' / '+(a?.directory||currentAlbum):'';$('filter').placeholder=inside?'筛选本页文件名':'筛选相册名称';$('pagination').hidden=!inside;$('add-photos').hidden=!inside;if(!inside){showUpload(false);$('album-note').textContent='相册数量 · '+albums.length+' 个相册';for(const a of albums){if(![a.id,a.directory].some(x=>x.toLocaleLowerCase().includes(filter)))continue;const item=document.createElement('button');item.className='folder';item.setAttribute('aria-label','打开相册 '+a.id);const icon=document.createElement('span');icon.className='folder-icon';icon.setAttribute('aria-hidden','true');const name=document.createElement('strong');name.textContent=a.directory;const meta=document.createElement('span');meta.className='folder-meta';meta.textContent=a.id+' · '+(a.enabled?'参与轮播':'未参与轮播');item.append(icon,name,meta);item.onclick=()=>goFolder(a.id);box.append(item)}}else for(const f of listing?.files||[]){if(!f.name.toLocaleLowerCase().includes(filter))continue;const item=document.createElement('article');item.className='photo';const icon=document.createElement('span');icon.className='file-icon';icon.textContent='BMP';icon.setAttribute('aria-hidden','true');const h=document.createElement('h3');h.textContent=f.name;const meta=document.createElement('p');meta.textContent=size(f.bytes)+' · '+(f.header_valid?'格式与尺寸检查通过':'格式或尺寸不合格');meta.title='设备端检查BMP头、尺寸及文件长度；此处未逐像素检查六色值。上传及实际解码时检查六色像素。';const actions=document.createElement('div');actions.className='actions';for(const [label,kind]of [['预览','preview'],['下载','download'],['删除','delete']]){const b=document.createElement('button');b.textContent=label;b.className=kind==='delete'?'danger':'secondary';b.onclick=()=>photoAction(kind,f.name);actions.append(b)}item.append(icon,h,meta,actions);box.append(item)}if(!box.children.length){const p=document.createElement('p');p.className='empty';p.textContent=filter?'没有匹配的项目。':!inside?'没有已配置的相册。':listing?'相册中没有 BMP 照片。':'正在读取照片…';box.append(p)}$('count').textContent=!inside?'相册文件夹':listing?'照片 · '+listing.total+' 张':'照片';$('page').textContent=listing&&listing.total?'第 '+(Math.floor(offset/limit)+1)+' / '+Math.ceil(listing.total/limit)+' 页':'—';enable()}
async function loadList(){listing=await(await request('/api/files?'+new URLSearchParams({album:currentAlbum,offset,limit}),{},true)).json();if(offset&&offset>=listing.total){offset=Math.max(0,Math.floor((listing.total-1)/limit)*limit);listing=await(await request('/api/files?'+new URLSearchParams({album:currentAlbum,offset,limit}),{},true)).json()}const a=albums.find(a=>a.id===currentAlbum);$('album-note').textContent=(a?.directory||'')+' · '+(a?.enabled?'参与轮播':'未参与轮播');draw()}
async function refreshAlbums(){await status();albums=(await(await request('/api/albums',{},true)).json()).albums;let requested='';try{requested=folderRoute()}catch{}if(requested&&!albums.some(a=>a.id===requested)){message('该相册不存在，已显示全部相册。',true);requested=''}if(requested!==currentAlbum){currentAlbum=requested;offset=0;listing=null;$('filter').value='';$('file').value='';selectFiles([]);showUpload(false)}if(currentAlbum)await loadList();else{listing=null;draw()}enable()}
async function operation(fn){if(working)return;working=true;document.body.dataset.operation='busy';enable();try{await fn()}catch(e){message(e.message,true)}finally{working=false;document.body.dataset.operation='';$('progress').hidden=true;enable();if(folderRoute()!==currentAlbum&&(!folderRoute()||albums.some(a=>a.id===folderRoute())))syncFolder()}}
async function waitIndex(before){const deadline=Date.now()+90000;while(Date.now()<deadline){await sleep(750);const s=await status(),c=s.control;if(c.files_revision>before&&!c.index_pending){if(c.index_error)throw Error('文件已修改，但播放索引更新失败：'+c.index_error+'。可用 API /api/rescan 重试。');return}}throw Error('文件已修改，索引完成尚未确认。请刷新状态后再操作。')}
async function photoAction(kind,name){if(!online||working||deviceBusy)return;const target=currentAlbum;if(kind==='delete'&&!await confirmDelete(name))return;if(target!==currentAlbum||working||deviceBusy){message('相册或设备状态已变化，请重新选择照片。',true);return}await operation(async()=>{message(kind==='delete'?'正在删除并更新播放列表…':'正在读取 '+name+'…');if(kind==='delete'){const before=(await status()).control.files_revision;await request(path(name),{method:'DELETE'});await waitIndex(before);await loadList();message('已删除 '+name);return}const blob=await(await request(path(name),{},true)).blob();if(kind==='preview'){window.photoPreview.show(blob,name,target);message('已读取预览。')}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);message('已交给浏览器下载：'+name)}})}
function selectFiles(files){chosen=Array.from(files);$('selected').textContent=chosen.length?'已选择 '+chosen.length+' 张 · '+size(chosen.reduce((n,f)=>n+f.size,0)):'尚未选择文件';enable()}
async function checkFile(f){if(!/\.bmp$/i.test(f.name)||f.name.startsWith('.')||f.name.includes('..')||/[<>:"\/\\|?*\x00-\x1f\x7f]/.test(f.name)||f.name.endsWith(' ')||new TextEncoder().encode(f.name).length>255)throw Error(f.name+'：请使用有效的 BMP 文件名。');if(f.size<54||f.size>2097152)throw Error(f.name+'：文件必须在 54 字节至 2 MiB 范围内。');const v=new DataView(await f.slice(0,54).arrayBuffer());if(v.getUint16(0,true)!==0x4d42||v.getUint32(14,true)<40||v.getUint16(26,true)!==1||v.getUint16(28,true)!==24||v.getUint32(30,true)!==0||v.getInt32(22,true)<=0)throw Error(f.name+'：必须是 24 位无压缩、正高度 BMP。')}
function putFile(f){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('PUT',path(f.name));x.timeout=65000;x.setRequestHeader('X-Album-Token',token);x.setRequestHeader('Content-Type','image/bmp');x.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=e.loaded/e.total*100};x.onload=()=>{let body;try{body=JSON.parse(x.responseText)}catch{body={message:'HTTP '+x.status}}if(x.status===201)resolve(body);else reject(Error(body.error==='busy'?'设备忙碌，请刷新后重试。':body.message||'上传失败（HTTP '+x.status+'）'))};x.onerror=x.ontimeout=()=>{markOffline();reject(Error('上传响应未确认，请恢复连接并刷新列表，核对是否已写入；不要直接重复上传。'))};x.send(f)})}
$('upload').onclick=()=>operation(async()=>{let completed=0;const batch=[...chosen];for(const f of batch)await checkFile(f);for(let i=0;i<batch.length;i++){const f=batch[i];message('上传 '+(i+1)+' / '+batch.length+'：'+f.name);$('progress').hidden=false;$('progress').value=0;try{const s=await status();if(s.control.busy)throw Error('设备忙碌，请稍后重试。');await putFile(f);message('已写入 '+f.name+'，等待播放索引更新…');await waitIndex(s.control.files_revision);completed++;chosen=chosen.filter(x=>x!==f);selectFiles(chosen)}catch(e){try{await loadList()}catch{}throw Error('本批已完成 '+completed+' / '+batch.length+' 张。'+f.name+'：'+e.message)}}$('file').value='';offset=0;await loadList();message('上传完成，共 '+completed+' 张。播放列表已更新。')});
$('file').onchange=e=>selectFiles(e.target.files);$('reload').onclick=()=>operation(async()=>{closePreview();await refreshAlbums();message('列表已更新。')});$('up').onclick=$('root').onclick=()=>goFolder('');$('add-photos').onclick=()=>showUpload($('upload-panel').hidden);$('close-upload').onclick=()=>showUpload(false);$('clear-files').onclick=()=>{$('file').value='';selectFiles([])};window.addEventListener('hashchange',syncFolder);$('previous').onclick=()=>operation(async()=>{offset=Math.max(0,offset-limit);await loadList()});$('following').onclick=()=>operation(async()=>{if(listing?.next_offset!=null){offset=listing.next_offset;await loadList()}});$('filter').oninput=draw;
for(const event of ['dragover','dragleave','drop'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.toggle('drag',event==='dragover');if(event==='drop'&&online&&!working&&!deviceBusy)selectFiles(e.dataTransfer.files)});
operation(refreshAlbums);setInterval(async()=>{if(working||polling)return;polling=true;try{await status()}catch{markOffline()}finally{polling=false}},5000);
</script></body></html>
